<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardVault – Boutique TCG</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--text:#f2f3f7;--muted:#9aa0b4;--accent:#ffb400;--border:#2a2e3d}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f9;--surface:#fff;--text:#14161f;--muted:#5d6377;--border:#dfe2ec}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 5%;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-size:1.4rem;font-weight:800;color:var(--accent)}
button{cursor:pointer;font:inherit;border:0;border-radius:8px}
.cart-btn{background:var(--accent);color:#000;padding:8px 14px;font-weight:700}
.hero{text-align:center;padding:60px 5% 40px}
.hero h1{font-size:clamp(1.8rem,5vw,3rem);margin-bottom:10px}
.hero p{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:0 5% 24px;max-width:1200px;margin:auto}
.filters input,.filters select{flex:1;min-width:140px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;padding:0 5% 60px;max-width:1200px;margin:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.art{height:170px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;position:relative}
.badge{position:absolute;top:10px;left:10px;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:1rem}
.info small{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.price{font-weight:800;font-size:1.1rem}
.add{background:var(--accent);color:#000;padding:7px 12px;font-weight:700}
.add:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
#drawer{position:fixed;top:0;right:-420px;width:min(400px,100%);height:100%;background:var(--surface);border-left:1px solid var(--border);padding:20px;display:flex;flex-direction:column;transition:right .3s;z-index:20}
#drawer.open{right:0}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
#overlay.open{display:block}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.close{background:none;color:var(--text);font-size:1.5rem}
#items{flex:1;overflow-y:auto}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:8px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;background:var(--border);color:var(--text)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;padding:16px 0}
.checkout{background:var(--accent);color:#000;padding:12px;font-weight:800;width:100%}
footer{text-align:center;padding:30px;color:var(--muted);border-top:1px solid var(--border);font-size:.9rem}
</style>
</head>
<body>

<header>
  <div class="logo">⚡ CardVault</div>
  <button class="cart-btn" id="openCart">🛒 Panier (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Cartes à collectionner TCG</h1>
  <p>Pokémon, Magic, Yu-Gi-Oh!, One Piece… Cartes certifiées, expédition rapide.</p>
</section>

<div class="filters">
  <input id="search" type="search" placeholder="Rechercher une carte…">
  <select id="game"><option value="">Tous les jeux</option></select>
  <select id="rarity"><option value="">Toutes raretés</option></select>
  <select id="sort">
    <option value="">Trier par</option>
    <option value="asc">Prix croissant</option>
    <option value="desc">Prix décroissant</option>
  </select>
</div>

<main class="grid" id="grid"></main>

<div id="overlay"></div>
<aside id="drawer">
  <div class="drawer-head"><h2>Mon panier</h2><button class="close" id="closeCart">×</button></div>
  <div id="items"></div>
  <div class="total"><span>Total</span><span id="total">0,00 €</span></div>
  <button class="checkout" id="checkout">Valider la commande</button>
</aside>

<footer>© 2026 CardVault – Livraison offerte dès 50 € d’achat</footer>

<script>
const CARDS = [
  {id:1,name:"Dracaufeu EX",game:"Pokémon",rarity:"Ultra Rare",price:89.9,stock:3,emoji:"🔥",color:"#e8590c"},
  {id:2,name:"Pikachu Illustrateur",game:"Pokémon",rarity:"Secrète",price:149,stock:1,emoji:"⚡",color:"#f5b800"},
  {id:3,name:"Mewtwo VSTAR",game:"Pokémon",rarity:"Rare",price:12.5,stock:20,emoji:"🔮",color:"#7048e8"},
  {id:4,name:"Black Lotus",game:"Magic",rarity:"Mythique",price:499,stock:1,emoji:"🌸",color:"#2b2b2b"},
  {id:5,name:"Liliana of the Veil",game:"Magic",rarity:"Mythique",price:54,stock:4,emoji:"💀",color:"#5c3d7a"},
  {id:6,name:"Llanowar Elves",game:"Magic",rarity:"Commune",price:1.2,stock:80,emoji:"🌿",color:"#2f9e44"},
  {id:7,name:"Magicien Sombre",game:"Yu-Gi-Oh!",rarity:"Ultra Rare",price:34.9,stock:6,emoji:"🧙",color:"#3b5bdb"},
  {id:8,name:"Dragon Blanc aux Yeux Bleus",game:"Yu-Gi-Oh!",rarity:"Secrète",price:79,stock:2,emoji:"🐉",color:"#1c7ed6"},
  {id:9,name:"Exodia le Maudit",game:"Yu-Gi-Oh!",rarity:"Rare",price:18,stock:0,emoji:"✋",color:"#868e96"},
  {id:10,name:"Monkey D. Luffy",game:"One Piece",rarity:"Secrète",price:65,stock:5,emoji:"🏴‍☠️",color:"#c92a2a"},
  {id:11,name:"Roronoa Zoro",game:"One Piece",rarity:"Rare",price:9.9,stock:15,emoji:"⚔️",color:"#2b8a3e"},
  {id:12,name:"Nami",game:"One Piece",rarity:"Commune",price:1.5,stock:60,emoji:"🍊",color:"#e8590c"}
];

const $ = id => document.getElementById(id);
const fmt = n => n.toFixed(2).replace(".", ",") + " €";
let cart = {};

// Remplir les filtres
[...new Set(CARDS.map(c => c.game))].forEach(g => $("game").add(new Option(g, g)));
[...new Set(CARDS.map(c => c.rarity))].forEach(r => $("rarity").add(new Option(r, r)));

function render(){
  const q = $("search").value.toLowerCase();
  const g = $("game").value, r = $("rarity").value, s = $("sort").value;
  let list = CARDS.filter(c =>
    c.name.toLowerCase().includes(q) && (!g || c.game === g) && (!r || c.rarity === r));
  if (s === "asc") list.sort((a,b) => a.price - b.price);
  if (s === "desc") list.sort((a,b) => b.price - a.price);

  $("grid").innerHTML = list.length ? list.map(c => `
    <article class="card">
      <div class="art" style="background:linear-gradient(135deg,${c.color},#000a)">
        <span class="badge">${c.rarity}</span>${c.emoji}
      </div>
      <div class="info">
        <h3>${c.name}</h3>
        <small>${c.game} · ${c.stock > 0 ? c.stock + " en stock" : "Rupture"}</small>
        <div class="row">
          <span class="price">${fmt(c.price)}</span>
          <button class="add" data-id="${c.id}" ${c.stock === 0 ? "disabled" : ""}>
            ${c.stock === 0 ? "Épuisé" : "Ajouter"}
          </button>
        </div>
      </div>
    </article>`).join("") : '<p class="empty">Aucune carte trouvée.</p>';
}

function renderCart(){
  const entries = Object.entries(cart);
  let total = 0, count = 0;
  $("items").innerHTML = entries.length ? entries.map(([id, qty]) => {
    const c = CARDS.find(x => x.id == id);
    total += c.price * qty; count += qty;
    return `<div class="item">
      <div><strong>${c.name}</strong><br><small>${fmt(c.price)}</small></div>
      <div class="qty">
        <button data-act="minus" data-id="${id}">−</button>${qty}
        <button data-act="plus" data-id="${id}">+</button>
      </div></div>`;
  }).join("") : '<p class="empty">Votre panier est vide.</p>';
  $("total").textContent = fmt(total);
  $("count").textContent = count;
}

function addToCart(id){
  const c = CARDS.find(x => x.id == id);
  if ((cart[id] || 0) < c.stock){ cart[id] = (cart[id] || 0) + 1; renderCart(); }
}

$("grid").addEventListener("click", e => {
  const b = e.target.closest(".add");
  if (b){ addToCart(b.dataset.id); toggleCart(true); }
});
$("items").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === "plus") addToCart(id);
  else { cart[id]--; if (cart[id] <= 0) delete cart[id]; renderCart(); }
});

function toggleCart(open){
  $("drawer").classList.toggle("open", open);
  $("overlay").classList.toggle("open", open);
}
$("openCart").onclick = () => toggleCart(true);
$("closeCart").onclick = $("overlay").onclick = () => toggleCart(false);
$("checkout").onclick = () => {
  if (!Object.keys(cart).length) return alert("Votre panier est vide.");
  alert("Merci pour votre commande ! (démo – aucun paiement réel)");
  cart = {}; renderCart(); toggleCart(false);
};
["search","game","rarity","sort"].forEach(id => $(id).addEventListener("input", render));

render(); renderCart();
</script>
</body>
</html>
